
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Object Detector</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin: 20px 0;
        }

        #camera {
            width: 100%;
            height: 65vh;
            object-fit: cover;
            display: none;
            background: #111;
        }

        .panel {
            padding: 20px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: 0;
            border-radius: 12px;
            background: white;
            color: black;
            font-size: 17px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.5;
        }

        #status {
            text-align: center;
            margin: 15px 0;
            color: #aaa;
        }

        #result {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-top: 15px;
        }

        #confidence {
            font-size: 16px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <h1>AI Object Detector</h1>

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <div class="panel">

        <button id="cameraButton">
            📷 IZINKAN KAMERA
        </button>

        <div id="status">
            Kamera belum diaktifkan
        </div>

        <div id="result"></div>
        <div id="confidence"></div>

    </div>


    <!-- =================================================
         1. TensorFlow.js
         HARUS DIMUAT TERLEBIH DAHULU
    ================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js">
    </script>


    <!-- =================================================
         2. Teachable Machine Image
         HARUS SETELAH TensorFlow.js
    ================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js">
    </script>


    <!-- =================================================
         3. SCRIPT KITA
    ================================================== -->

    <script src="./script.js"></script>

</body>
</html>
