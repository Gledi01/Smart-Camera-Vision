<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Object Detector</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101010;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 18px;
            text-align: center;
            background: #181818;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        #camera {
            width: 100%;
            max-height: 65vh;
            object-fit: cover;
            display: block;
            background: black;
        }

        .controls {
            padding: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #ffffff;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #status {
            text-align: center;
            margin: 12px 0;
            color: #aaa;
        }

        #predictions {
            padding: 0 15px 20px;
        }

        .prediction {
            margin: 8px 0;
        }

        .label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .bar {
            height: 8px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            background: #fff;
            transition: width 0.15s;
        }

        .best {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 12px;
            margin-bottom: 10px;
            background: #1c1c1c;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>AI Object Detector</h1>
</header>

<video id="camera" autoplay playsinline></video>

<div class="controls">
    <button id="startButton">
        📷 Izinkan & Mulai Kamera
    </button>

    <div id="status">
        Model belum dimuat
    </div>

    <div id="predictions"></div>
</div>

<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>

<!-- Teachable Machine Image -->
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>

<script src="script.js"></script>

</body>
</html>
