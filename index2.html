```html
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Object Detector</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin: 20px;
            font-size: 22px;
        }

        #camera {
            width: 100%;
            height: 65vh;
            object-fit: cover;
            background: #111;
            display: none;
        }

        .panel {
            padding: 20px;
        }

        button {
            width: 100%;
            padding: 17px;
            border: 0;
            border-radius: 12px;
            background: white;
            color: black;
            font-size: 17px;
            font-weight: bold;
        }

        button:disabled {
            opacity: .5;
        }

        #status {
            text-align: center;
            margin: 18px 0;
            color: #aaa;
        }

        #result {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        #confidence {
            text-align: center;
            color: #aaa;
            margin-top: 5px;
        }

    </style>
</head>


<body>

    <h1>
        AI Object Detector
    </h1>


    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>


    <div class="panel">

        <button id="startCamera">
            📷 IZINKAN KAMERA
        </button>


        <div id="status">
            Memeriksa sistem...
        </div>


        <div id="result"></div>

        <div id="confidence"></div>

    </div>


    <!-- ==================================================
         TENSORFLOW.JS
    ================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js">
    </script>


    <script>

        const camera =
            document.getElementById("camera");

        const button =
            document.getElementById("startCamera");

        const status =
            document.getElementById("status");

        const result =
            document.getElementById("result");

        const confidence =
            document.getElementById("confidence");


        let model = null;
        let stream = null;


        // ==================================================
        // CEK TENSORFLOW
        // ==================================================

        window.addEventListener(
            "load",
            () => {

                if (
                    typeof tf === "undefined"
                ) {

                    status.textContent =
                        "❌ TensorFlow.js gagal dimuat";

                    return;
                }


                status.textContent =
                    "🟢 Sistem siap — tekan tombol kamera";

            }
        );


        // ==================================================
        // START
        // ==================================================

        button.addEventListener(
            "click",
            startAI
        );


        async function startAI() {

            try {

                button.disabled = true;


                // ==========================================
                // CAMERA PERMISSION
                // ==========================================

                status.textContent =
                    "📷 Meminta izin kamera...";


                stream =
                    await navigator
                    .mediaDevices
                    .getUserMedia({

                        video: {
                            facingMode: {
                                ideal: "environment"
                            },

                            width: {
                                ideal: 1280
                            },

                            height: {
                                ideal: 720
                            }
                        },

                        audio: false

                    });


                camera.srcObject =
                    stream;


                camera.style.display =
                    "block";


                await camera.play();


                status.textContent =
                    "🟢 Kamera aktif";


                // ==========================================
                // LOAD MODEL
                // ==========================================

                status.textContent =
                    "🧠 Memuat model AI...";


                model =
                    await tf.loadLayersModel(
                        "./model/model.json"
                    );


                status.textContent =
                    "🟢 Model berhasil dimuat";


                button.textContent =
                    "🟢 AI AKTIF";


                detect();


            } catch (error) {

                console.error(
                    error
                );


                status.innerHTML =
                    "❌ " +
                    error.name;


                result.textContent =
                    error.message;


                button.disabled =
                    false;

            }

        }


        // ==================================================
        // DETECTION
        // ==================================================

        async function detect() {

            if (!model) return;


            try {

                const tensor =
                    tf.browser
                    .fromPixels(camera)
                    .resizeBilinear([
                        224,
                        224
                    ])
                    .toFloat()
                    .div(255)
                    .expandDims(0);


                const prediction =
                    model.predict(tensor);


                const data =
                    await prediction.data();


                let maxIndex = 0;


                for (
                    let i = 1;
                    i < data.length;
                    i++
                ) {

                    if (
                        data[i] >
                        data[maxIndex]
                    ) {

                        maxIndex = i;

                    }

                }


                const labels = [

                    "Gelas",
                    "Botol",
                    "Ponsel",
                    "Human",
                    "Computer",
                    "Meja",
                    "Kursi",
                    "Sepeda Motor",
                    "Buku",
                    "Mobil",
                    "Kipas Angin"

                ];


                const name =
                    labels[maxIndex];


                const percent =
                    (
                        data[maxIndex] *
                        100
                    ).toFixed(1);


                result.textContent =
                    name;


                confidence.textContent =
                    percent + "%";


                tensor.dispose();


                if (
                    prediction.dispose
                ) {

                    prediction.dispose();

                }

            } catch (error) {

                console.error(
                    "Prediction error:",
                    error
                );

            }


            requestAnimationFrame(
                detect
            );

        }

    </script>

</body>

</html>
